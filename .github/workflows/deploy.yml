name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung install must not hold the deploy slot for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q
      - name: Validate every edition (publish rules; fails on drafts / needs_review)
        run: python validate.py --strict
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build pages + PDFs (fails unless every PDF is exactly 2 pages)
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python build.py
      - name: Keep the PDFs for inspection if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-pdfs
          path: site/pdfs
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
