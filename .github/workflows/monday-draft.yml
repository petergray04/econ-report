name: Monday draft

on:
  schedule:
    - cron: "0 10 * * 1"      # Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date YYYY-MM-DD (default: today if Monday, else next Monday)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore FRED response cache
        uses: actions/cache@v4
        with:
          path: .cache/fred
          key: fred-${{ github.run_id }}
          restore-keys: fred-
      - name: Health check — fetcher still reproduces the verified 2026-09-23 edition
        run: python fetch_actuals.py --check data/2026-09-23.json
      - name: Draft next edition
        id: draft
        run: |
          DATE="${{ inputs.date }}"
          python draft_edition.py ${DATE:+--date "$DATE"} --pr-body out/pr_body.md | tee out/draft.log
          FILE=$(git ls-files --others --exclude-standard data/ | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "edition=$(basename "$FILE" .json)" >> "$GITHUB_OUTPUT"
      - name: Open draft pull request
        if: steps.draft.outputs.file != ''
        run: |
          ED="${{ steps.draft.outputs.edition }}"
          BR="draft/$ED"
          if gh pr list --head "$BR" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR for $BR already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"
          git add "${{ steps.draft.outputs.file }}"
          git commit -m "Draft edition $ED (automated; needs review)"
          git push -u origin "$BR"
          gh pr create --draft --base main --head "$BR" \
            --title "Edition $ED — draft for review" --body-file out/pr_body.md
      - name: Nothing drafted
        if: steps.draft.outputs.file == ''
        run: echo "No new data file (edition already exists)."
